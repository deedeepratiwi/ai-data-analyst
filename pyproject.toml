[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "AI CSV to Business Insight Generator - Production-grade AI analytics system"
authors = [
    {name = "AI Data Analyst Team"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.1",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "pandas==2.2.0",
    "numpy==1.26.3",
    "matplotlib==3.8.2",
    "seaborn==0.13.1",
    "plotly==5.18.0",
    "openai==1.10.0",
    "anthropic==0.18.1",
    "sqlalchemy==2.0.25",
    "python-multipart==0.0.18",
    "python-dotenv==1.0.0",
    "aiofiles==23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "httpx==0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
